services:
  db:
    image: postgres:16
    restart: on-failure
    environment:
      POSTGRES_USER: nova
      POSTGRES_PASSWORD: nova_dev_password
      POSTGRES_DB: nova
    volumes:
      - nova_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nova -d nova"]
      interval: 5s
      timeout: 3s
      retries: 24

  web:
    build:
      context: ./nova
    restart: on-failure
    working_dir: /app
    labels:
      base44.project: "NOVA AI VIDEO AGENT ULTRA"
      base44.kind: "web"
      base44.port: "3000"
    command:
      - sh
      - -ec
      - |
        if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
        exec node --watch server/index.js
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DATABASE_URL=postgres://nova:nova_dev_password@db:5432/nova
      - BASE44_PREVIEW_MODE
      - BASE44_PUBLIC_HOST_SUFFIX
      - BASE44_SANDBOX_HOST_DOMAIN
      - NOVA_DATA_DIR=/app/data
    env_file:
      - path: /run/base44/app.env
        required: false
    volumes:
      - ./nova:/app
      - nova_node_modules:/app/node_modules
      - nova_data:/app/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:3000/api/health').then(r=>r.json()).then(j=>process.exit(j.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 45s

volumes:
  nova_pg:
  nova_node_modules:
  nova_data:
